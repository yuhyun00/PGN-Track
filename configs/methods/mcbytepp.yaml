# McByte++ (official defaults): CMC (conditional ORB 1/4), EdgeTAM masks, online re-ID reconnection.
_base_: mcbytepp_nomask.yaml
masks:
  type: mcbytepp               # EdgeTAM mask propagation + McByte's mask cue in the conditioned assignment
  checkpoint: edgetam.pt       # under $WEIGHTS_ROOT
  offload: false               # true: frames and memory bank in host memory (same outputs, less GPU memory)
